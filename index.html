<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>在线编辑器</title>
<meta name="description" content="免费在线 Markdown 编辑器，支持 Monaco Editor 语法高亮、实时预览、文件拖拽。">
<meta name="keywords" content="在线编辑器, Markdown编辑器, 文本编辑器, Monaco Editor">
<meta name="msvalidate.01" content="094ECD52C4255ECD057DE8C73671632D" />
<meta property="og:title" content="在线编辑器">
<meta property="og:description" content="免费在线 Markdown 编辑器，基于 Monaco Editor，支持语法高亮和实时预览。">
<meta property="og:type" content="website">
<meta property="og:url" content="https://billyism.github.io/editer/">
<meta name="theme-color" content="#1e1e1e" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect x='10' y='10' width='80' height='80' rx='14' fill='%231e1e1e'/%3E%3Cpath d='M25 72L30 38L38 55L45 33L52 55L60 38L65 72' fill='none' stroke='%23569cd6' stroke-width='5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
:root{--bg:#1e1e1e;--fg:#d4d4d4;--bd:#333;--bd2:#2d2d2d;--cb:#2d2d2d;--cc:#ce9178;--lk:#4fc1ff;--hd:#569cd6;--hbg:#252526;--hfg:#ccc;--hfh:#2a2d2e;--sbb:#1e1e1e;--sbl:#2d2d2d;--sbf:#888;--dp:rgba(0,122,204,.15);--bqc:#569cd6;--bqt:#8b949e;--thb:#2d2d2d;--pvb:#1e1e1e;--pvf:#d4d4d4;--hrc:#333;--active:rgba(86,156,214,.25)}
@media(prefers-color-scheme:light){:root{--bg:#fff;--fg:#333;--bd:#e0e0e0;--bd2:#eee;--cb:#f6f8fa;--cc:#c7254e;--lk:#0366d6;--hd:#1a1a1a;--hbg:#f3f3f3;--hfg:#555;--hfh:#ddd;--sbb:#f3f3f3;--sbl:#e0e0e0;--sbf:#666;--dp:rgba(3,102,214,.1);--bqc:#0366d6;--bqt:#6a737d;--thb:#f6f8fa;--pvb:#fff;--pvf:#333;--hrc:#e0e0e0;--active:rgba(3,102,214,.15)}}

*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:var(--fg)}

#header{display:flex;align-items:center;height:40px;padding:0 12px;background:var(--hbg);border-bottom:1px solid var(--bd);gap:12px;user-select:none;-webkit-app-region:drag}
#h-left{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--hfg);font-weight:500;white-space:nowrap;-webkit-app-region:no-drag}
#h-left .ico{font-size:16px}
#h-right{display:flex;align-items:center;gap:2px;margin-left:auto;-webkit-app-region:no-drag}
.h-btn{width:32px;height:32px;border:none;border-radius:6px;background:transparent;color:var(--hfg);cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center;transition:all .15s;position:relative}
.h-btn:hover{background:var(--hfh);color:var(--fg)}
.h-btn:active{transform:scale(.92)}
.h-btn.active{background:var(--active);color:var(--lk)}
.h-btn.active:hover{background:var(--active);filter:brightness(1.2)}
.h-sep{width:1px;height:20px;background:var(--bd);margin:0 4px}

#main{display:flex;width:100%;height:calc(100% - 40px - 22px)}
#editor-wrap{flex:1;height:100%;min-width:0;position:relative}
#editor-wrap.hidden{display:none}
#preview-wrap{display:none;height:100%;overflow-y:auto;background:var(--pvb);color:var(--pvf);padding:40px 56px;font-size:15px;line-height:1.7}
#preview-wrap.visible{display:block;border-left:1px solid var(--bd);flex:1;min-width:0}
#preview-wrap.fullscreen{display:block;flex:1}

#preview-wrap h1,#preview-wrap h2,#preview-wrap h3,#preview-wrap h4{color:var(--hd);margin:20px 0 10px;font-weight:600}
#preview-wrap h1{font-size:28px;border-bottom:1px solid var(--bd);padding-bottom:8px}
#preview-wrap h2{font-size:22px}
#preview-wrap h3{font-size:18px}
#preview-wrap p{margin:6px 0}
#preview-wrap a{color:var(--lk);text-decoration:none}
#preview-wrap a:hover{text-decoration:underline}
#preview-wrap code{background:var(--cb);padding:2px 6px;border-radius:3px;font-family:'Cascadia Code','Fira Code','Consolas',monospace;font-size:13px;color:var(--cc)}
#preview-wrap pre{background:var(--cb);padding:16px;border-radius:6px;overflow-x:auto;margin:10px 0}
#preview-wrap pre code{background:none;padding:0;color:var(--pvf);font-size:13px}
#preview-wrap blockquote{border-left:3px solid var(--bqc);padding:4px 16px;color:var(--bqt);margin:10px 0}
#preview-wrap ul,#preview-wrap ol{padding-left:24px;margin:6px 0}
#preview-wrap li{margin:2px 0}
#preview-wrap table{border-collapse:collapse;margin:10px 0;width:100%}
#preview-wrap th,#preview-wrap td{border:1px solid var(--bd);padding:8px 12px;text-align:left}
#preview-wrap th{background:var(--thb);font-weight:600}
#preview-wrap img{max-width:100%;border-radius:4px}
#preview-wrap hr{border:none;border-top:1px solid var(--hrc);margin:20px 0}
#preview-wrap input[type=checkbox]{margin-right:6px}
#preview-wrap h1:first-child,#preview-wrap h2:first-child,#preview-wrap h3:first-child{margin-top:0}

#file-inp{display:none}

#sb{position:fixed;bottom:0;left:0;right:0;z-index:50;height:22px;background:var(--sbb);border-top:1px solid var(--sbl);color:var(--sbf);display:flex;align-items:center;padding:0 10px;font-size:12px;gap:20px;user-select:none}
#sb span{white-space:nowrap}

#dropping{display:none;position:fixed;inset:0;z-index:200;background:var(--dp);border:2px dashed var(--lk);pointer-events:none;align-items:center;justify-content:center;font-size:24px;color:var(--lk)}
</style>
</head>
<body>

<div id="header">
  <div id="h-left"><span class="ico">✎</span> 在线编辑器</div>
  <div id="h-right">
    <button class="h-btn" id="h-open" title="打开文件">📂</button>
    <button class="h-btn" id="h-save" title="下载">💾</button>
    <span class="h-sep"></span>
    <button class="h-btn" id="h-preview" title="预览">👁</button>
    <button class="h-btn" id="h-clear" title="清空">🗑</button>
  </div>
</div>

<div id="main">
  <div id="editor-wrap">
    <div id="dropping"></div>
  </div>
  <div id="preview-wrap"></div>
</div>

<input type="file" id="file-inp" accept=".md,.txt,.markdown,.html,.css,.js,.ts,.json,.xml,.yaml,.yml,.py,.rs,.go,.java,.c,.cpp,.sh,.toml,.ini,.cfg">

<div id="sb">
  <span id="sb-lang">Markdown</span>
  <span id="sb-pos">Ln 1, Col 1</span>
  <span id="sb-words">0 words</span>
</div>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs/loader.js"></script>
<script>
(function(){
var editor, mode = 'edit';
var LANG_MAP = {md:'markdown',markdown:'markdown',txt:'plaintext',js:'javascript',ts:'typescript',jsx:'javascript',tsx:'typescript',html:'html',css:'css',scss:'scss',less:'less',json:'json',xml:'xml',yaml:'yaml',yml:'yaml',py:'python',rs:'rust',go:'go',java:'java',c:'c',cpp:'cpp',h:'c',hpp:'cpp',sh:'shell',bash:'shell',zsh:'shell',toml:'plaintext',ini:'ini',cfg:'ini',conf:'ini',sql:'sql',php:'php',rb:'ruby',swift:'swift',kt:'kotlin',scala:'scala',r:'r'};

var isZh = (navigator.language||'').startsWith('zh');
var i18n = {
  title: isZh ? '在线编辑器' : 'Online Editor',
  open: isZh ? '打开文件' : 'Open',
  save: isZh ? '下载' : 'Download',
  preview: isZh ? '预览' : 'Preview',
  previewOff: isZh ? '编辑' : 'Edit',
  clear: isZh ? '清空' : 'Clear',
  ln: isZh ? '行' : 'Ln',
  col: isZh ? '列' : 'Col',
  words: isZh ? '字' : 'words',
  dropFile: isZh ? '拖拽文件到此处' : 'Drop file to open',
  clearConfirm: isZh ? '确定清空？' : 'Clear all content?',
};

function getTheme(){return window.matchMedia('(prefers-color-scheme:dark)').matches?'vs-dark':'vs'}

// Apply i18n
document.title = i18n.title;
document.querySelector('#h-left').innerHTML = '<span class="ico">✎</span> ' + i18n.title;
document.getElementById('h-open').title = i18n.open + ' (Ctrl+O)';
document.getElementById('h-save').title = i18n.save + ' (Ctrl+S)';
document.getElementById('h-preview').title = i18n.preview + ' (Ctrl+Shift+V)';
document.getElementById('h-clear').title = i18n.clear;
document.getElementById('dropping').textContent = i18n.dropFile;

function updatePreview(){
  if(!editor) return;
  var pw = document.getElementById('preview-wrap');
  if(!pw.classList.contains('visible') && !pw.classList.contains('fullscreen')) return;
  pw.innerHTML = marked.parse(editor.getValue() || '');
}

function togglePreview(){
  var pw = document.getElementById('preview-wrap');
  var ew = document.getElementById('editor-wrap');
  var btn = document.getElementById('h-preview');
  if(mode === 'edit'){
    mode = 'split';
    pw.className = 'visible';
    ew.style.flex = '1';
    btn.classList.add('active');
    btn.textContent = '✎';
    btn.title = i18n.previewOff + ' (Ctrl+Shift+V)';
    updatePreview();
  } else if(mode === 'split'){
    mode = 'preview';
    pw.className = 'fullscreen';
    ew.classList.add('hidden');
    updatePreview();
  } else {
    mode = 'edit';
    pw.className = '';
    ew.classList.remove('hidden');
    ew.style.flex = '';
    btn.classList.remove('active');
    btn.textContent = '👁';
    btn.title = i18n.preview + ' (Ctrl+Shift+V)';
  }
  if(editor) setTimeout(function(){ editor.layout(); }, 10);
}

function saveFile(){
  if(!editor) return;
  var c = editor.getValue();
  var b = new Blob([c], {type: 'text/plain'});
  var u = URL.createObjectURL(b);
  var a = document.createElement('a');
  a.href = u; a.download = 'document.md'; a.click();
  URL.revokeObjectURL(u);
}

function readFile(file){
  var r = new FileReader();
  r.onload = function(e){
    if(!editor) return;
    editor.setValue(e.target.result);
    var ext = file.name.split('.').pop().toLowerCase();
    var lang = LANG_MAP[ext] || 'markdown';
    monaco.editor.setModelLanguage(editor.getModel(), lang);
    document.getElementById('sb-lang').textContent = lang.charAt(0).toUpperCase() + lang.slice(1);
    updatePreview();
  };
  r.readAsText(file);
}

// Monaco init
require.config({ paths: { vs: 'https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs' }});
require(['vs/editor/editor.main'], function(){
  var saved = localStorage.getItem('md-editor-content') || '';

  editor = monaco.editor.create(document.getElementById('editor-wrap'), {
    value: saved,
    language: 'markdown',
    theme: getTheme(),
    automaticLayout: true,
    wordWrap: 'on',
    minimap: { enabled: true, scale: 1, showSlider: 'mouseover' },
    fontSize: 15,
    lineNumbers: 'on',
    scrollBeyondLastLine: false,
    renderWhitespace: 'selection',
    padding: { top: 16 },
    tabSize: 2,
    cursorBlinking: 'smooth',
    cursorSmoothCaretAnimation: 'on',
    smoothScrolling: true,
    bracketPairColorization: { enabled: true },
    guides: { indentation: true, bracketPairs: true },
  });

  // Follow system theme
  window.matchMedia('(prefers-color-scheme:dark)').addEventListener('change',function(e){
    monaco.editor.setTheme(e.matches?'vs-dark':'vs');
  });

  // Cursor position
  editor.onDidChangeCursorPosition(function(e){
    document.getElementById('sb-pos').textContent = i18n.ln + ' ' + e.position.lineNumber + ', ' + i18n.col + ' ' + e.position.column;
  });

  // Auto-save + word count + preview update
  var saveTimer, previewTimer;
  editor.onDidChangeModelContent(function(){
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function(){
      try { localStorage.setItem('md-editor-content', editor.getValue()); } catch(_){}
    }, 400);

    clearTimeout(previewTimer);
    previewTimer = setTimeout(updatePreview, 300);

    var text = editor.getValue();
    var words = text.trim() ? text.trim().split(/\s+/).length : 0;
    document.getElementById('sb-words').textContent = words + ' ' + i18n.words;
  });

  updatePreview();
});

// Header buttons
document.getElementById('h-open').addEventListener('click', function(){
  document.getElementById('file-inp').click();
});
document.getElementById('h-save').addEventListener('click', saveFile);
document.getElementById('h-preview').addEventListener('click', togglePreview);
document.getElementById('h-clear').addEventListener('click', function(){
  if(confirm(i18n.clearConfirm)) {
    if(editor) editor.setValue('');
  }
});

// File input
document.getElementById('file-inp').addEventListener('change', function(e){
  var f = e.target.files[0];
  if(f) readFile(f);
  this.value = '';
});

// Drag & drop
var dropEl = document.getElementById('dropping');
var dragCnt = 0;
document.addEventListener('dragenter', function(e){
  e.preventDefault(); e.stopPropagation();
  dragCnt++;
  if(dragCnt === 1) dropEl.style.display = 'flex';
});
document.addEventListener('dragleave', function(e){
  e.preventDefault(); e.stopPropagation();
  dragCnt--;
  if(dragCnt <= 0){ dragCnt = 0; dropEl.style.display = 'none'; }
});
document.addEventListener('dragover', function(e){
  e.preventDefault(); e.stopPropagation();
});
document.addEventListener('drop', function(e){
  e.preventDefault(); e.stopPropagation();
  dragCnt = 0;
  dropEl.style.display = 'none';
  var f = e.dataTransfer.files[0];
  if(f) readFile(f);
});

// Keyboard shortcuts (outside editor for global handler)
document.addEventListener('keydown', function(e){
  var mod = e.ctrlKey || e.metaKey;
  if(mod && e.key === 's'){ e.preventDefault(); saveFile(); }
  if(mod && e.key === 'o'){ e.preventDefault(); document.getElementById('file-inp').click(); }
  if(mod && e.shiftKey && e.key === 'V'){ e.preventDefault(); togglePreview(); }
});

})();
</script>
</body>
</html>
